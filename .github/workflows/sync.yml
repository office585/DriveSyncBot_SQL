name: Hourly DriveSyncBot Job

on:
  schedule:
    # Minden óra 00. percében automatikusan lefut a felhőben
    - cron: '0 * * * *'
  # Kézi indítás lehetősége a GitHub felületén
  workflow_dispatch:

jobs:
  run-sync-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Kód letöltése
      uses: actions/checkout@v3

    - name: Python 3.10 beállítása
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Csomagok telepítése
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Robot futtatása
      env:
        # A Secret-ben tárolt JSON kulcs átadása a kódnak
        GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      run: |
        python sync_drive.py
