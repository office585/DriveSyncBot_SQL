name: Daily DriveSyncBot Job

on:
  schedule:
    # Minden nap reggel 5:00-kor magyar idő szerint (nyári időszámítás alatt)
    - cron: '0 3 * * *'
  # Kézi indítás lehetősége a GitHub felületén
  workflow_dispatch:

jobs:
  run-sync-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Kód letöltése
      uses: actions/checkout@v3

    - name: Python 3.10 beállítása
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Csomagok telepítése
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Robot futtatása
      env:
        GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      run: |
        python sync_drive.py
