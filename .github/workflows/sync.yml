name: Daily DriveSyncBot Job

on:
  schedule:
    # 03:00 UTC: nyáron 05:00, télen 04:00 magyar idő szerint.
    - cron: '0 3 * * *'
  workflow_dispatch:

# Ne fusson egyszerre két adatbázis-építés/feltöltés.
concurrency:
  group: daily-drivesyncbot
  cancel-in-progress: false

jobs:
  run-sync-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Kód letöltése
      uses: actions/checkout@v3

    - name: Python 3.10 beállítása
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Csomagok telepítése
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install 'google-cloud-storage>=3.0,<4.0' 'google-crc32c>=1.5,<2.0'

    - name: Robot futtatása
      env:
        GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      run: |
        python sync_drive.py
